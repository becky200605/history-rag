services:
  mysql:
    image: mysql:8.4
    container_name: history-rag-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-history_rag}
      MYSQL_USER: ${MYSQL_USER:-history_rag}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ../docker-data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - history-rag-prod
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: history-rag-nginx
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - gateway
      - langgraph
    networks:
      - history-rag-prod
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
    container_name: history-rag-frontend
    command: sh -c "cd frontend && pnpm run build && pnpm run start -- --hostname 0.0.0.0 --port 3000"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../frontend/.production.env
    environment:
      - NODE_ENV=production
      - CI=true
    networks:
      - history-rag-prod
    restart: unless-stopped

  auth-migrate:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      args:
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
    container_name: history-rag-auth-migrate
    command: sh -c "cd frontend && pnpm auth:migrate"
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../frontend/.production.env
    environment:
      - NODE_ENV=production
      - CI=true
    networks:
      - history-rag-prod
    restart: "no"

  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: history-rag-gateway
    command: sh -c "cd backend && uv run uvicorn src.gateway.app:app --host 0.0.0.0 --port 8001"
    env_file:
      - ../backend/.production.env
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../backend/.production.env:/app/backend/.env:ro
      - ../skills:/app/skills:ro
      - ../knowledge:/app/knowledge
      - ../backend/.deer-flow:/app/backend/.deer-flow
    working_dir: /app
    environment:
      - CI=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - history-rag-prod
    restart: unless-stopped

  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    container_name: history-rag-langgraph
    command: sh -c "cd backend && uv run langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024"
    env_file:
      - ../backend/.production.env
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../backend/.production.env:/app/backend/.env:ro
      - ../skills:/app/skills:ro
      - ../knowledge:/app/knowledge
      - ../backend/.deer-flow:/app/backend/.deer-flow
    working_dir: /app
    environment:
      - CI=true
    networks:
      - history-rag-prod
    restart: unless-stopped

networks:
  history-rag-prod:
    driver: bridge
