services:
  nginx:
    image: nginx:alpine
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-2026}:2026"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - gateway
      - langgraph
    networks:
      - history-rag-prod
    restart: unless-stopped

  frontend:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
    command: sh -c "cd frontend && pnpm run build && pnpm exec next start --hostname 0.0.0.0 --port 3000"
    env_file:
      - ../frontend/.production.env
    environment:
      - NODE_ENV=production
      - CI=true
      - BACKEND_BASE_URL=http://gateway:8001
      # Server-side Next route handlers must reach the langgraph container directly.
      - LANGGRAPH_BASE_URL=http://langgraph:2024
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - history-rag-prod
    restart: unless-stopped

  auth-migrate:
    build:
      context: ../
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com/}
        PNPM_STORE_PATH: ${PNPM_STORE_PATH:-/root/.local/share/pnpm/store}
    command: sh -c "cd frontend && pnpm auth:migrate"
    env_file:
      - ../frontend/.production.env
    environment:
      - NODE_ENV=production
      - CI=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - history-rag-prod
    restart: "no"

  gateway:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    command: sh -c "cd backend && python -m uvicorn src.gateway.app:app --host 0.0.0.0 --port 8001"
    env_file:
      - ../backend/.production.env
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../skills:/app/skills:ro
      - ${PROD_KNOWLEDGE_DIR:-/var/lib/history-rag/knowledge}:/app/knowledge
      - ${PROD_STATE_DIR:-/var/lib/history-rag/backend/.deer-flow}:/app/backend/.deer-flow
    working_dir: /app
    environment:
      - CI=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - history-rag-prod
    restart: unless-stopped

  langgraph:
    build:
      context: ../
      dockerfile: backend/Dockerfile
    command: sh -c "cd backend && langgraph dev --no-browser --allow-blocking --no-reload --host 0.0.0.0 --port 2024 --n-jobs-per-worker 2"
    env_file:
      - ../backend/.production.env
    volumes:
      - ../config.yaml:/app/config.yaml:ro
      - ../skills:/app/skills:ro
      - ${PROD_KNOWLEDGE_DIR:-/var/lib/history-rag/knowledge}:/app/knowledge
      - ${PROD_STATE_DIR:-/var/lib/history-rag/backend/.deer-flow}:/app/backend/.deer-flow
    working_dir: /app
    environment:
      - CI=true
      - BG_JOB_ISOLATED_LOOPS=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - history-rag-prod
    restart: unless-stopped

networks:
  history-rag-prod:
    driver: bridge
