name: Unit Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: unit-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend-unit-tests:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout (no action required)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/histroy-llm/history-rag.git"
          if [ -d "${{ github.workspace }}/.git" ]; then
            cd "${{ github.workspace }}"
            git remote set-url origin "$REPO_URL"
            git fetch origin
          else
            git clone "$REPO_URL" "${{ github.workspace }}"
          fi
          cd "${{ github.workspace }}"
          git checkout --detach "${{ github.sha }}"

      - name: Install backend dependencies
        working-directory: ${{ github.workspace }}/backend
        run: uv sync --group dev

      - name: Lint backend
        working-directory: ${{ github.workspace }}/backend
        run: make lint

      - name: Run unit tests of backend
        working-directory: ${{ github.workspace }}/backend
        run: make test
